name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quizzz
          POSTGRES_PASSWORD: quizzz
          POSTGRES_DB: quizzz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizzz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://quizzz:quizzz@localhost:5432/quizzz_test
      TEST_DATABASE_URL: postgres://quizzz:quizzz@localhost:5432/quizzz_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      BETTER_AUTH_URL: http://localhost:3000
      STORAGE_DIR: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
