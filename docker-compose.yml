services:
  db:
    image: postgres:16
    container_name: quizzz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quizzz
      POSTGRES_USER: quizzz
      POSTGRES_PASSWORD: quizzz
    ports:
      # Set DB_PORT if 5432 is already used by a local Postgres.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - quizzz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizzz -d quizzz"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22-alpine
    container_name: quizzz-app
    working_dir: /app
    command: sh -c "npm ci && npm run db:migrate && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://quizzz:quizzz@db:5432/quizzz
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-dev-only-secret}
      BETTER_AUTH_URL: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      STORAGE_DIR: /app/storage
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  quizzz_pg_data:
  app_node_modules:
